<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Noema · 论文精读归档</title>
<meta name="description" content="Noema（诺埃玛）：每周一篇 AI 核心技术方向的论文精读归档，按月排列，可按方向筛选与搜索。">
<meta name="theme-color" content="#f6f5ed">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23F6F3EC'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23171512'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css?v=5">
</head>
<body class="home">

<a class="skip-link" href="#archive">跳到归档</a>

<header class="masthead">
  <div class="shell masthead-row">
    <a class="mark" href="index.html">Noema</a>
    <nav class="site-nav" aria-label="板块">
      <a href="index.html" aria-current="page">论文归档</a>
      <a href="daily.html">日报</a>
      <a href="weekly.html">周报</a>
    </nav>
  </div>
</header>

<main>

  <section class="cover shell" aria-labelledby="cover-title">
    <div class="cover-copy">
      <p class="cover-kicker">诺埃玛 · AI 研究手记</p>
      <h1 id="cover-title">Noema<span aria-hidden="true">.</span></h1>
      <p class="cover-description">每周读一篇 AI 核心技术方向的论文，<br>把读过的留在档案里。</p>
      <a class="archive-jump" href="#archive">浏览论文归档 <span aria-hidden="true">↓</span></a>
    </div>
    <a class="cover-feature" href="#archive" id="cover-feature">
      <img src="assets/paper-folds.webp" alt="" width="1380" height="600" fetchpriority="high">
      <div class="feature-caption">
        <p class="feature-meta">最新精读 <time id="feature-date"></time></p>
        <p class="feature-title" id="feature-title">论文归档</p>
        <span class="feature-arrow" aria-hidden="true">↗</span>
      </div>
    </a>
  </section>

  <div class="dispatch shell">
    <a href="daily.html" id="latest-day"><strong>最新日报</strong><span id="latest-headline">按日期浏览日报</span><i aria-hidden="true">→</i></a>
    <a href="weekly.html"><strong>周报</strong><span>本周回顾</span><i aria-hidden="true">→</i></a>
  </div>

  <section class="archive shell" id="archive">
    <div class="archive-head">
      <h2 class="archive-title">论文归档</h2>

      <div class="tools">
        <div class="filters" id="chips" role="group" aria-label="按方向筛选"></div>
        <label class="search">
          <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true" focusable="false">
            <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.4"></circle>
            <path d="M13.2 13.2 17 17" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path>
          </svg>
          <input id="q" name="q" type="search" placeholder="标题或作者…" autocomplete="off" aria-label="搜索标题或作者">
        </label>
      </div>
    </div>

    <p class="count" id="count" aria-live="polite"></p>

    <div id="months" class="month-list"></div>

    <p class="empty" id="empty" hidden>没有匹配的论文。<button type="button" class="linklike" id="reset">清除筛选</button></p>
    <p class="load-error" id="load-error" hidden></p>
  </section>

</main>

<footer class="site-footer">
  <div class="shell footer-row">
    <span class="footer-mark">Noema</span>
    <span class="footer-note">架构 · 训练方法 · Agent · 评测</span>
    <span class="footer-note">2026</span>
  </div>
</footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/app.js?v=3"></script>
</body>
</html>
